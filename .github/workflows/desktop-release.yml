name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained desktop app
        run: >-
          dotnet publish
          PCDSLibrary.Desktop/PCDSLibrary.Desktop/PCDSLibrary.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/PCDSLibrary.Desktop-win-x64

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\PCDSLibrary.Desktop-win-x64'
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DAppVersion=$version" `
            "/DPublishDir=$publishDir" `
            "/DInstallerOutputDir=$installerDir" `
            'PCDSLibrary.Desktop\installer\PCDSLibrary.Desktop.iss'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          artifacts/installer/Setup.exe
          --title "PCDS Library Desktop $env:GITHUB_REF_NAME"
          --generate-notes
